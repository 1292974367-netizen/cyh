<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0a0f1e">
  <meta name="description" content="cyh 的灵感知识库 —— 设计师的个人星图：工作复盘、视觉灵感、AI 工作流、后续规划。">
  <title>cyh 的灵感知识库</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='12' fill='%230a0f1e'/%3E%3Ccircle cx='20' cy='20' r='8' fill='%23f2b866'/%3E%3Ccircle cx='20' cy='20' r='14' fill='none' stroke='%23f2b866' stroke-opacity='.4'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
  <script src="assets/boards/pins-data.js" defer></script>
  <script src="data/reviews.js" defer></script>
  <script src="data/boards.js" defer></script>
  <script src="data/projects.js" defer></script>
  <script src="data/plans.js" defer></script>
  <script src="content.js" defer></script>
  <script src="universe.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <div class="site" id="site">
    <header class="masthead">
      <div class="wordmark" aria-label="cyh">cyh<span class="wordmark-star" aria-hidden="true">✳</span></div>
      <h1>灵感知识库 <span>—— 设计师的个人星图：</span></h1>
      <p>工作复盘、视觉灵感、AI 工作流、后续规划。</p>
      <div class="edition">VOL.05 <i></i> 2026.11 <i></i> 展厅 / 展示 / 室内 · AI</div>
    </header>
    <div class="atlas-note" aria-hidden="true"><span>PERSONAL ATLAS</span><span>散落的灵感，在这里连成星系。</span></div>
    <main class="atlas" aria-label="个人灵感星图">
      <canvas id="universe-canvas" aria-hidden="true"></canvas>
      <div id="map-images" role="group" aria-label="画板图片卫星，点击放大"></div>
      <div id="map-labels" role="group" aria-label="工作复盘、视觉灵感、AI 工作流与接下来，点击天体查看预览"></div>
    </main>
    <nav id="galaxy-nav" class="galaxy-nav" aria-label="飞往星系">
      <button type="button" data-galaxy="s1" style="--hue:var(--amber)" aria-label="飞往工作复盘星系"><i aria-hidden="true"></i>复盘</button>
      <button type="button" data-galaxy="s2" style="--hue:var(--violet)" aria-label="飞往视觉灵感星系"><i aria-hidden="true"></i>灵感</button>
      <button type="button" data-galaxy="s3" style="--hue:var(--teal)" aria-label="飞往 AI 工作流星系"><i aria-hidden="true"></i>工作流</button>
      <button type="button" data-galaxy="s4" style="--hue:var(--grey)" aria-label="飞往接下来星系"><i aria-hidden="true"></i>接下来</button>
    </nav>
    <div id="view-controls" class="view-controls" role="group" aria-label="宇宙视野">
      <button type="button" id="zoom-out" aria-label="缩小">−</button>
      <output id="zoom-level" aria-label="缩放倍数">1.0×</output>
      <button type="button" id="zoom-in" aria-label="放大">+</button>
      <span class="control-divider" aria-hidden="true"></span>
      <button type="button" id="reset-view" aria-label="返回全景">全景 ↗</button>
    </div>
    <p id="view-status" class="sr-only" aria-live="polite" aria-atomic="true"></p>
    <footer class="footer">
      <div class="totals" aria-label="内容统计"><span>正在展开星图…</span></div>
      <div class="legend"><span class="legend-orbit" aria-hidden="true"></span><span><span class="desktop-hint">滚轮缩放 · 拖动漫游 · 双击归航</span><span class="mobile-hint"><span>双指缩放 · 单指漫游</span><span>双击归航</span></span><small>点击天体探索 · ESC 返回全景</small></span></div>
    </footer>
  </div>
  <dialog id="preview" class="preview" aria-labelledby="preview-title">
    <div class="sheet-handle" aria-hidden="true"></div>
    <header class="preview-header">
      <div class="preview-heading"><p id="preview-kicker"></p><h2 id="preview-title"></h2></div>
      <button type="button" id="preview-close" class="icon-button" aria-label="关闭预览">✕</button>
    </header>
    <div id="preview-content" class="preview-content" tabindex="0" aria-label="预览正文"></div>
    <footer class="preview-footer"><button type="button" id="preview-back">← 返回星图</button><a id="preview-link" target="_blank" rel="noopener noreferrer" hidden></a></footer>
  </dialog>
  <dialog id="image-viewer" class="image-viewer" aria-labelledby="image-viewer-title">
    <header class="image-viewer-header">
      <p id="image-viewer-board"></p>
      <button type="button" id="image-viewer-close" class="icon-button" aria-label="关闭大图，返回画板">✕</button>
    </header>
    <div class="image-viewer-stage">
      <button type="button" id="image-viewer-prev" class="icon-button" aria-label="上一张图片">‹</button>
      <img id="image-viewer-image" alt="">
      <button type="button" id="image-viewer-next" class="icon-button" aria-label="下一张图片">›</button>
    </div>
    <footer class="image-viewer-footer">
      <p id="image-viewer-title"></p>
      <div><span id="image-viewer-counter" aria-live="polite"></span><a id="image-viewer-link" class="pin-source" target="_blank" rel="noopener noreferrer">在 Pinterest 打开 ↗</a></div>
    </footer>
  </dialog>
  <noscript><p class="noscript">请在浏览器中启用 JavaScript，以探索这张星图。</p></noscript>
</body>
</html>
